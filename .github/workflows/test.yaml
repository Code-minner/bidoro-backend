name: Pull request Tests & Security Checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: "20"
  IMAGE_NAME: bidoro-backend

jobs:
  # ── Stage 1: Security ──────────────────────────────────────────────────────
  security-scan:
    name: Security – Secret Detection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for trufflehog)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0          # trufflehog needs full git history

      # Scan entire git history for secrets (tokens, keys, credentials)
      - name: TruffleHog – full history scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --only-verified

      - name: TruffleHog detailed output
        run: |
          trufflehog filesystem . --only-verified --json

      # Scan the current diff/working tree with gitleaks
      - name: Install gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar -xz
          sudo mv gitleaks /usr/local/bin/

      - name: Secret scan
        run: gitleaks detect --source . --verbose --redact

  # ── Stage 2: Test Build ────────────────────────────────────────────────────
  test-build:
    name: Test Build – Install, Test & Docker trial
    runs-on: ubuntu-latest
    needs: security-scan          # only runs if security stage passes
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies (clean install)
        run: npm ci

      
      - name: Run tests
        run: npm test
        env:
          NODE_ENV: test
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

      - name: Run linter
        run: npm run lint --if-present

      # TypeScript compile check
      - name: TypeScript build check
        run: npx tsc --skipLibCheck --noEmit

      # Trial Docker build – verifies the image compiles but does NOT push
      - name: Docker trial build
        run: |
          docker build \
            --build-arg NODE_ENV=production \
            --tag ${{ env.IMAGE_NAME }}:${{ github.sha }} \
            --tag ${{ env.IMAGE_NAME }}:latest \
            .
          echo "✅ Trial build successful – image not pushed"

  