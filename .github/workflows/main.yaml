name: Main CI/CD Pipeline

on:
  pull_request:
    branches:
      - main
    types:
      - closed
  workflow_dispatch:

env:
  NODE_VERSION: "20"
  IMAGE_NAME: bidoro-backend
  REGISTRY: ghcr.io                                      # GitHub Container Registry (free)
  FULL_IMAGE: ghcr.io/${{ github.repository_owner }}/bidoro-backend

jobs:
  # ── Stage 1: Security ──────────────────────────────────────────────────────
  security-scan:
    name: Security – Secret Detection
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout (full history for trufflehog)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog – full history scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --only-verified

      - name: Install gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar -xz
          sudo mv gitleaks /usr/local/bin/

      - name: Gitleaks – working tree scan
        run: gitleaks detect --source . --verbose --redact

  # ── Stage 2: Test, Build & Push Image ─────────────────────────────────────
  test-build-push:
    name: Test, Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: security-scan
    permissions:
      contents: read
      packages: write              # needed to push to GHCR

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
        env:
          NODE_ENV: test
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

      - name: Run linter
        run: npm run lint --if-present

      - name: TypeScript build check
        run: npx tsc --skipLibCheck --noEmit

      # Log in to GitHub Container Registry
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # auto-provided by GitHub, no setup needed

      # Build and push the real image — tagged with commit SHA and latest
      - name: Build & push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          build-args: NODE_ENV=production
          tags: |
            ${{ env.FULL_IMAGE }}:${{ github.sha }}
            ${{ env.FULL_IMAGE }}:latest

  # ── Stage 3: Deploy ────────────────────────────────────────────────────────
  deploy:
    name: Deploy to DigitalOcean Droplet
    runs-on: ubuntu-latest
    needs: test-build-push
    if: github.event.pull_request.merged == true || github.event_name == 'workflow_dispatch'
    environment: development        # approval gate in repo settings

    steps:
      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DROPLET_SSH_KEY }}

      - name: Add Droplet to known hosts
        run: ssh-keyscan -H ${{ secrets.DROPLET_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to Droplet
        env:
          DROPLET_USER: ${{ secrets.DROPLET_USER }}
          DROPLET_HOST: ${{ secrets.DROPLET_HOST }}
          FULL_IMAGE: ${{ env.FULL_IMAGE }}
          IMAGE_TAG: ${{ github.sha }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          ssh $DROPLET_USER@$DROPLET_HOST bash << EOF
            set -e

            echo '→ Logging in to GHCR'
            echo "$GHCR_TOKEN" | docker login ghcr.io -u $GITHUB_ACTOR --password-stdin

            echo '→ Pulling new image'
            docker pull $FULL_IMAGE:$IMAGE_TAG

            echo '→ Stopping and removing old container (if exists)'
            docker stop bidoro-backend || true
            docker rm   bidoro-backend || true

            echo '→ Starting new container'
            docker run -d \
              --name bidoro-backend \
              --restart unless-stopped \
              --env-file /etc/bidoro/.env \
              -p 3003:3003 \
              $FULL_IMAGE:$IMAGE_TAG

            echo '→ Removing dangling images'
            docker image prune -f

            echo '✅ Deployment complete'
          EOF

      - name: Health check
        env:
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          echo "Waiting 15s for container to start..."
          sleep 15
          curl --fail --silent --max-time 30 $APP_URL \
            && echo "✅ Health check passed" \
            || (echo "❌ Health check failed" && exit 1)